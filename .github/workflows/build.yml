name: Build Billard Stream

on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/**']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build .exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name "BillardStream" app/app.py
          echo "EXE built:"
          dir dist\BillardStream.exe
      
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: BillardStream-Windows
          path: dist/BillardStream.exe
